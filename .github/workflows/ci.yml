name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK/WebKit
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet -tags desktop,production,webkit2_41 ./...
      - name: Test
        run: go test -race ./...
      - name: Build desktop app
        run: go build -tags desktop,production,webkit2_41 -o /dev/null .
