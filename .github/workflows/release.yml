name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-latest }
          - { goos: darwin, goarch: amd64, runner: macos-latest }
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: windows, goarch: arm64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK/WebKit
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        if: matrix.goos != 'windows'
        run: go test ./...
      - name: Package
        run: scripts/package.sh ${{ matrix.goos }} ${{ matrix.goarch }} ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
